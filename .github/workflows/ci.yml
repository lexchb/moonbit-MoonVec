# 持续集成：与 DEVELOPMENT.md 12.2 的 CI 作业设计保持一致。
#
# 三个作业：
#   check        —— fmt / 类型检查 / wasm-gc 编译面 / 公共 API 界面
#   unit         —— native / js / wasm 三目标测试，含测试计数门限断言（12.1 纪律 3）
#   integration  —— 拉真实 Qdrant 容器，remote 后端跑一致性套件 C1–C15
#
# 关键约束：
#   - 工具链版本与 async 版本必须成对锁定（11.1 / 12.2）：本地开发锁定 moon 0.1.20260920，
#     与 moon.mod 中 "moonbitlang/async@0.22.1" 配对。
#   - CI 安装 latest：实测 cli.moonbitlang.com 只公开 `latest` / `nightly` 两个键，
#     任何版本化路径（binaries/0.1.* / cores/core-0.1.*）均 403（2026-10-22 验证）。
#     故 CI 跟随 nightly，安装后打印 `moon version` 记录实际版本供追溯；
#     若 nightly 漂移导致构建失败，优先排查工具链与 async 的兼容性（见 DEVELOPMENT.md 11.1）。
#   - wasm-gc 只保证可编译，async 测试在该目标下静默跳过，故只做 moon check、不跑测试。

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # CDN 无版本化下载，安装 nightly 最新版（见上方注释）；`moon version` 会记录实际版本
  MOON_VERSION: latest
  # 最低测试数门限：防「只看退出码 0 得到假绿」（DEVELOPMENT.md 12.1 纪律 3）
  MIN_TESTS: 40

jobs:
  check:
    name: Check（fmt / 类型检查 / API 界面）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MoonBit 工具链（固定版本）
        run: |
          curl -fsSL --retry 3 https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOON_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          # 记录实际工具链版本（nightly 会漂移，供失败时追溯）
          "$HOME/.moon/bin/moon" version --all
          # 建立 mooncakes 注册表索引（全新环境必须；否则 moon check/test 无法解析 moon.mod 依赖）
          "$HOME/.moon/bin/moon" update
      - name: 提交前必跑：格式检查
        run: moon fmt --check
      - name: 类型检查（0 warning）
        run: moon check
      - name: wasm-gc 编译面（只保证可编译，不跑测试）
        run: moon check --target wasm-gc
      - name: 公共 API 界面检查
        run: moon info

  unit:
    name: 单元测试（native / js / wasm）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MoonBit 工具链（固定版本）
        run: |
          curl -fsSL --retry 3 https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOON_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          # 记录实际工具链版本（nightly 会漂移，供失败时追溯）
          "$HOME/.moon/bin/moon" version --all
          # 建立 mooncakes 注册表索引（全新环境必须；否则 moon check/test 无法解析 moon.mod 依赖）
          "$HOME/.moon/bin/moon" update
      - name: 三目标测试 + 计数门限断言
        run: |
          set -euo pipefail
          run_test() {
            local target="$1" log total
            log="$(moon test --target "$target" 2>&1)" || { printf '%s\n' "$log"; exit 1; }
            printf '%s\n' "$log"
            total="$(printf '%s\n' "$log" | grep -oE '^Total tests: [0-9]+' | grep -oE '[0-9]+$')"
            if [[ -z "$total" || "$total" -lt "$MIN_TESTS" ]]; then
              echo "::error::测试计数未达门限: target=$target total=$total gate=$MIN_TESTS"
              exit 1
            fi
          }
          run_test native
          run_test js
          run_test wasm

  integration:
    name: 集成测试（真实 Qdrant 容器）
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.14.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MoonBit 工具链（固定版本）
        run: |
          curl -fsSL --retry 3 https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOON_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          # 记录实际工具链版本（nightly 会漂移，供失败时追溯）
          "$HOME/.moon/bin/moon" version --all
          # 建立 mooncakes 注册表索引（全新环境必须；否则 moon check/test 无法解析 moon.mod 依赖）
          "$HOME/.moon/bin/moon" update
      - name: 等待 Qdrant 就绪
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null 2>&1; then
              echo "qdrant ready"
              exit 0
            fi
            sleep 2
          done
          echo "qdrant 未在预期时间内就绪"
          exit 1
      - name: remote 后端对真实 Qdrant 跑一致性套件 C1–C15
        env:
          QDRANT_URL: http://127.0.0.1:6333
        run: moon test --target native
